<!DOCTYPE html>
<html>
<head>
    <title>Machine Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html, body {
            width: 100%;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            overflow-x: hidden;
            -webkit-text-size-adjust: 100%;
        }
        
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: clamp(5px, 2vw, 20px);
        }
        
        h1 {
            color: #0ff;
            font-size: clamp(16px, 4vw, 28px);
            margin: clamp(5px, 1vh, 15px) 0;
            text-align: center;
            letter-spacing: 1px;
        }
        
        .status-bar {
            font-size: clamp(14px, 3.5vw, 24px);
            margin: clamp(5px, 1vh, 15px) 0;
            font-weight: bold;
            text-align: center;
        }
        
        .on { color: #0f0; }
        .off { color: #f00; }
        
        /* ✅ Universal Grid: सभी resolutions के लिए */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: clamp(8px, 1.8vw, 16px);
            width: 100%;
            max-width: min(95vw, 800px);
            margin: 0 auto;
        }
        
        /* ✅ Small box size */
        .machine {
            background: #333;
            padding: clamp(5px, 1.5vw, 12px);
            border-radius: clamp(4px, 1vw, 10px);
            border: 2px solid #555;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: clamp(70px, 14vw, 120px);
        }
        
        /* Whole tab = ONE solid colour from efficiency (like a share market tile)
           green >= 80%, yellow 50-79%, red < 50% */
        .machine.glow-high { --eff: 22, 160, 60; }
        .machine.glow-mid  { --eff: 214, 150, 0; }
        .machine.glow-low  { --eff: 205, 35, 35; }
        
        .machine {
            background: rgb(var(--eff, 70, 70, 70));
            border: 3px solid #000;
            /* Ring outside the tab = ON (green) / OFF (red), separated by a black line */
            box-shadow: 0 0 0 3px var(--state, #888), 0 0 14px var(--state, #888);
        }
        
        .machine.on-state    { --state: #0f0; }
        .machine.off-state   { --state: #f00; }
        .machine.nosig-state { --state: #999; }
        
        /* Selected machine (buttons below) */
        .machine.selected {
            outline: 3px solid #ff0;
            outline-offset: 5px;
        }
        
        /* ✅ Small responsive text */
        .machine h2 {
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
            font-size: clamp(14px, 3.5vw, 24px);
            margin: 2px 0;
            font-weight: bold;
        }
        
        /* ON / OFF written inside, in a dark badge so it reads on every colour */
        .machine .status {
            display: inline-block;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            padding: 1px 12px;
            font-size: clamp(12px, 2.8vw, 18px);
            margin: 2px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        
        .machine.on-state .status    { color: #0f0; }
        .machine.off-state .status   { color: #f44; }
        .machine.nosig-state .status { color: #ccc; font-size: clamp(9px, 2vw, 13px); }
        
        .machine .time {
            color: #fff;
            font-size: clamp(8px, 2vw, 11px);
            margin: 2px 0;
        }
        
        .machine .date {
            color: rgba(255, 255, 255, 0.85);
            font-size: clamp(7px, 1.8vw, 10px);
            margin: 1px 0;
        }
        
        /* ✅ Efficiency */
        .efficiency-box {
            width: 100%;
            margin-top: clamp(3px, 1vw, 8px);
            padding-top: clamp(3px, 1vw, 6px);
            border-top: 1px solid rgba(255, 255, 255, 0.45);
            text-align: center;
        }
        
        .efficiency-label {
            font-size: clamp(9px, 2vw, 12px);
            color: #fff;
            margin-bottom: 3px;
            text-align: center;
        }
        
        .efficiency-value {
            font-size: clamp(15px, 3.4vw, 24px);
            font-weight: bold;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.7);
        }
        
        /* ON / OFF time of this shift in HH:MM (dark badge) */
        .hours {
            display: inline-flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 2px 8px;
            margin-top: 3px;
            padding: 2px 8px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 6px;
            font-size: clamp(9px, 2.2vw, 14px);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
        }
        
        .hours .h-on  { color: #0f0; }
        .hours .h-off { color: #f66; }
        
        /* ✅ 12 Buttons in Horizontal Line */
        .buttons-row {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: clamp(3px, 1vw, 8px);
            width: 100%;
            max-width: min(95vw, 800px);
            margin: clamp(8px, 2vh, 20px) auto;
        }
        
        .btn {
            padding: clamp(6px, 1.5vw, 12px) clamp(4px, 1vw, 10px);
            font-size: clamp(10px, 2vw, 14px);
            background: #0ff;
            color: #000;
            border: none;
            border-radius: clamp(4px, 1vw, 8px);
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
            text-align: center;
        }
        
        .btn:hover, .btn:active {
            background: #0aa;
            transform: scale(0.95);
        }
        
        .btn.refresh {
            background: #0f0;
            color: #000;
        }
        
        #lastUpdate {
            color: #888;
            font-size: clamp(10px, 2vw, 14px);
            margin: 10px 0;
            text-align: center;
        }
        
        /* ✅ Mobile portrait (small phones) */
        @media (max-width: 480px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
            .buttons-row {
                grid-template-columns: repeat(6, 1fr);
            }
        }
        
        /* ✅ Tablet */
        @media (min-width: 481px) and (max-width: 768px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .buttons-row {
                grid-template-columns: repeat(6, 1fr);
            }
        }
        
        /* ✅ Desktop */
        @media (min-width: 769px) {
            .grid {
                grid-template-columns: repeat(4, 1fr);
            }
            .buttons-row {
                grid-template-columns: repeat(12, 1fr);
            }
        }
        
        /* ✅ Landscape mode */
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding: 5px;
            }
            h1 {
                font-size: 16px;
                margin: 3px 0;
            }
            .status-bar {
                font-size: 14px;
                margin: 3px 0;
            }
            .machine {
                min-height: 60px;
            }
        }
        
        /* ✅ Small Screen */
        @media (max-width: 360px) {
            .machine h2 {
                font-size: 14px;
            }
            .machine .status {
                font-size: 10px;
            }
            .machine .time {
                font-size: 8px;
            }
        }
        
        /* ✅ Large Screen */
        @media (min-width: 1200px) {
            .grid {
                max-width: 900px;
            }
            .buttons-row {
                max-width: 900px;
            }
        }
    </style>
</head>
<body>
    <h1>MACHINE MONITOR</h1>
    
    <div class="status-bar">
        <span class="on">ON: <span id="onCount">0</span></span>
        &nbsp;|&nbsp;
        <span class="off">OFF: <span id="offCount">0</span></span>
    </div>
    
    <div class="grid" id="machines">Loading...</div>
    
    <!-- ✅ 12 Buttons in Horizontal Line -->
    <div class="buttons-row" id="buttonRow">
        <button class="btn" onclick="filterMachine('M1')">M1</button>
        <button class="btn" onclick="filterMachine('M2')">M2</button>
        <button class="btn" onclick="filterMachine('M3')">M3</button>
        <button class="btn" onclick="filterMachine('M4')">M4</button>
        <button class="btn" onclick="filterMachine('M5')">M5</button>
        <button class="btn" onclick="filterMachine('M6')">M6</button>
        <button class="btn" onclick="filterMachine('M7')">M7</button>
        <button class="btn" onclick="filterMachine('M8')">M8</button>
        <button class="btn" onclick="filterMachine('M9')">M9</button>
        <button class="btn" onclick="filterMachine('M10')">M10</button>
        <button class="btn" onclick="filterMachine('M11')">M11</button>
        <button class="btn refresh" onclick="fetchData()">↻</button>
    </div>
    
    <p id="lastUpdate"></p>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbzoxw2VMo6dURaPEPrUzSrv9OpWC42dgwK4FTWe4NlLINI7T--9JlCJ0wjoqsbodx5k0A/exec';
        let allData = [];
        
        function fetchData() {
            const callbackName = 'jsonpCb_' + Date.now();
            
            window[callbackName] = function(data) {
                allData = data;
                renderData(data);
                document.getElementById('lastUpdate').textContent =
                    'Last Update: ' + new Date().toLocaleString('en-IN');
                
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
            };
            
            const script = document.createElement('script');
            script.src = URL + '?callback=' + callbackName;
            document.body.appendChild(script);
        }
        
        // Minutes -> "HH:MM"
        function hhmm(min) {
            const m = Math.round(Number(min) || 0);
            return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
        }
        
        let selectedMachine = '';
        
        // One machine tab: border + ON/OFF text = machine state, inner glow = efficiency
        function machineCard(m) {
            const status = String(m.status || '');
            const cls = status === 'ON' ? 'on-state' : status === 'OFF' ? 'off-state' : 'nosig-state';
            const eff = Number(m.efficiency) || 0;
            const glow = eff >= 80 ? 'glow-high' : eff >= 50 ? 'glow-mid' : 'glow-low';
            const sel = m.machine === selectedMachine ? ' selected' : '';
            
            // ✅ DD/MM/YYYY format
            let dateStr = m.date || '';
            if (!dateStr && m.time) {
                const today = new Date();
                dateStr = String(today.getDate()).padStart(2, '0') + '/' +
                          String(today.getMonth() + 1).padStart(2, '0') + '/' + today.getFullYear();
            }
            
            return '<div class="machine ' + cls + ' ' + glow + sel + '">' +
                '<h2>' + m.machine + '</h2>' +
                '<div class="status">' + status + '</div>' +
                '<div class="time">' + (m.time || '') + '</div>' +
                '<div class="date">' + dateStr + (m.shift ? ' | Shift ' + m.shift : '') + '</div>' +
                '<div class="efficiency-box">' +
                    '<div class="efficiency-label">Eff: ' +
                        '<span class="efficiency-value">' + eff + '%</span>' +
                    '</div>' +
                    '<div class="hours">' +
                        '<span class="h-on">ON ' + hhmm(m.onTime) + '</span>' +
                        '<span class="h-off">OFF ' + hhmm(m.offTime) + '</span>' +
                    '</div>' +
                '</div>' +
            '</div>';
        }
        
        function renderData(data) {
            let on = 0, off = 0;
            data.forEach(m => {
                if (m.status === 'ON') on++;
                else off++;
            });
            
            document.getElementById('onCount').textContent = on;
            document.getElementById('offCount').textContent = off;
            document.getElementById('machines').innerHTML = data.map(machineCard).join('');
        }
        
        // Button: highlight that machine (press again to remove). Stays after auto refresh.
        function filterMachine(machineName) {
            selectedMachine = selectedMachine === machineName ? '' : machineName;
            renderData(allData);
        }
        
        // Initial load
        fetchData();
        
        // Auto refresh every 15 seconds
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
