<!DOCTYPE html>
<html>
<head>
    <title>Machine Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body { 
            font-family: Arial; 
            background: #000; 
            color: #fff; 
            text-align: center;
            padding: 10px;
            margin: 0;
        }
        h1 { color: #0ff; font-size: 20px; margin: 8px 0; }
        .status-bar { 
            font-size: 20px; 
            margin: 12px; 
            font-weight: bold;
        }
        .on { color: #0f0; }
        .off { color: #f00; }
        
        /* ✅ 3 boxes in one line */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 0 auto;
        }
        
        /* ✅ Small box size */
        .machine {
            background: #333;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #555;
            transition: border-color 0.3s;
        }
        .machine.on-state { 
            border-color: #0f0; 
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.4);
        }
        .machine.off-state { 
            border-color: #f00; 
            box-shadow: 0 0 8px rgba(255, 0, 0, 0.4);
        }
        
        /* ✅ Small text */
        .machine h2 { 
            font-size: 24px; 
            margin: 3px 0; 
        }
        .machine p {
            font-size: 16px;
            margin: 3px 0;
            font-weight: bold;
        }
        .machine.on-state p { color: #0f0; }
        .machine.off-state p { color: #f00; }
        .machine small {
            color: #aaa;
            font-size: 10px;
        }
        
        /* ✅ Small efficiency box */
        .efficiency-box {
            margin-top: 8px;
            padding-top: 6px;
            border-top: 1px solid #555;
        }
        .efficiency-label {
            font-size: 11px;
            color: #ccc;
            margin-bottom: 3px;
        }
        .efficiency-bar {
            width: 100%;
            height: 6px;
            background: #444;
            border-radius: 3px;
            overflow: hidden;
            margin: 3px 0;
        }
        .efficiency-fill {
            height: 100%;
            transition: width 0.5s;
            border-radius: 3px;
        }
        .eff-high { background: linear-gradient(90deg, #0f0, #0a0); }
        .eff-mid  { background: linear-gradient(90deg, #ff0, #fa0); }
        .eff-low  { background: linear-gradient(90deg, #f00, #a00); }
        .efficiency-value {
            font-size: 14px;
            font-weight: bold;
            color: #fff;
        }
        .time-detail {
            font-size: 9px;
            color: #aaa;
            margin-top: 3px;
        }
        
        button {
            padding: 10px 30px;
            font-size: 16px;
            background: #0ff;
            border: none;
            border-radius: 6px;
            margin: 15px;
            cursor: pointer;
            font-weight: bold;
        }
        #lastUpdate { color: #888; font-size: 12px; }
        
        /* ✅ Mobile पर 2 columns (small screen) */
        @media (max-width: 500px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .machine {
                padding: 8px;
            }
            .machine h2 { font-size: 20px; }
            .machine p { font-size: 14px; }
            .efficiency-value { font-size: 12px; }
        }
    </style>
</head>
<body>
    <h1>MACHINE MONITOR</h1>
    
    <div class="status-bar">
        <span class="on">ON: <span id="onCount">0</span></span>
        &nbsp;|&nbsp;
        <span class="off">OFF: <span id="offCount">0</span></span>
    </div>
    
    <div class="grid" id="machines">Loading...</div>
    
    <button onclick="fetchData()">REFRESH</button>
    <p id="lastUpdate"></p>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbxHQAN5FIVUJt9xrlEhibUNk1yLLrMdiSmIEp3Sruo2yvy-FHu6_t1a3X30yOrw2QzuaA/exec';
        
        function fetchData() {
            const callbackName = 'jsonpCb_' + Date.now();
            
            window[callbackName] = function(data) {
                let html = '';
                let on = 0, off = 0;
                
                data.forEach(m => {
                    if (m.status === 'ON') on++;
                    else off++;
                    
                    const cls = m.status === 'ON' ? 'on-state' : 'off-state';
                    
                    // Efficiency class
                    let effClass = 'eff-low';
                    if (m.efficiency >= 80) effClass = 'eff-high';
                    else if (m.efficiency >= 50) effClass = 'eff-mid';
                    
                    // ✅ ON/OFF color + Efficiency % दोनों
                    html += '<div class="machine ' + cls + '">' +
                        '<h2>' + m.machine + '</h2>' +
                        '<p>' + m.status + '</p>' +
                        '<small>' + m.time + '</small>' +
                        '<div class="efficiency-box">' +
                            '<div class="efficiency-label">Eff: ' +
                                '<span class="efficiency-value">' + m.efficiency + '%</span>' +
                            '</div>' +
                            '<div class="efficiency-bar">' +
                                '<div class="efficiency-fill ' + effClass + '" style="width:' + m.efficiency + '%"></div>' +
                            '</div>' +
                            '<div class="time-detail">' +
                                'ON: ' + m.onTime.toFixed(0) + 'm | ' +
                                'OFF: ' + m.offTime.toFixed(0) + 'm' +
                            '</div>' +
                        '</div>' +
                        '</div>';
                });
                
                document.getElementById('onCount').textContent = on;
                document.getElementById('offCount').textContent = off;
                document.getElementById('machines').innerHTML = html;
                document.getElementById('lastUpdate').textContent = 
                    'Last Update: ' + new Date().toLocaleTimeString();
                
                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
            };
            
            const script = document.createElement('script');
            script.src = URL + '?callback=' + callbackName;
            document.body.appendChild(script);
        }
        
        fetchData();
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
