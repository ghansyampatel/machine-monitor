<!DOCTYPE html>
<html>
<head>
    <title>Machine Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
            -webkit-text-size-adjust: 100%;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2px;
        }

        /* HEADER */
        h1 {
            color: #0ff;
            font-size: clamp(30px, 10vw, 46px);
            font-weight: 900;
            margin: 4px 0 2px;
            text-align: center;
            letter-spacing: 2px;
            flex-shrink: 0;
        }

        /* ON / OFF summary — shown as two 50:50 bordered boxes, below the Part nav */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 0 8px;
            margin: 6px 0;
            flex-shrink: 0;
        }

        .stat-box {
            flex: 1 1 50%;
            text-align: center;
            border: 3px solid;
            border-radius: 10px;
            background: #111;
            padding: 8px 10px;
            font-weight: 900;
            font-size: clamp(28px, 9vw, 40px);
            letter-spacing: 0.5px;
        }

        .stat-box.on-box  { border-color: #0f0; color: #0f0; }
        .stat-box.off-box { border-color: #f00; color: #f00; }

        /* PART NAV */
        .part-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: clamp(10px, 3vw, 18px);
            margin: 4px 0;
            flex-shrink: 0;
        }

        .arrow-btn {
            background: none;
            border: none;
            color: #ff0;
            font-size: clamp(40px, 11vw, 56px);
            cursor: pointer;
            padding: 1px 12px;
            line-height: 1;
            transition: all 0.2s;
            user-select: none;
        }

        .arrow-btn:hover { transform: scale(1.15); color: #fff; }
        .arrow-btn:active { transform: scale(0.95); }
        .arrow-btn:disabled { color: #555; cursor: not-allowed; transform: none; }

        .part-box {
            border: 3px solid #ff0;
            border-radius: 8px;
            padding: 5px 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 170px;
            background: #111;
        }

        .part-name {
            color: #ff0;
            font-size: clamp(28px, 8vw, 36px);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* MAIN CONTENT */
        .main-content {
            flex: 1;
            width: 100%;
            max-width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin: 2px 0;
            padding: 0 8px;   /* keeps left/right cards clear of the screen edge */
            min-height: 0;
        }

        /* MACHINE CARDS — sized square by JS to always fit (3 x 4) without scrolling */
        .buttons-row {
            display: flex;
            flex-wrap: wrap;
            align-content: center;
            justify-content: center;
            align-items: center;
            gap: 10px;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        /* Machine Card - square */
        .btn {
            --card-size: 100px; /* overwritten inline by JS per card */
            padding: 4px;
            color: #fff;
            border: 2px solid #000;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.15s;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            overflow: hidden;
            position: relative;
            box-shadow: 0 0 0 2px var(--state, #888), 0 0 8px var(--state, #888);
            /* width/height are set inline by JS to keep the card perfectly square */
        }

        .btn.glow-high { background: linear-gradient(180deg, #16a34a, #15803d); }
        .btn.glow-mid  { background: linear-gradient(180deg, #eab308, #a16207); }
        .btn.glow-low  { background: linear-gradient(180deg, #dc2626, #991b1b); }

        .btn.on-state  { --state: #22ff22; }
        .btn.off-state { --state: #ff2222; }
        .btn.nosig-state { --state: #999; }

        .btn:hover, .btn:active {
            transform: scale(0.95);
            filter: brightness(1.15);
        }

        .btn.selected {
            outline: 2px solid #ff0;
            outline-offset: 1px;
        }

        /* LINE 1: Name + Status */
        .btn .name-status-line {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            width: 100%;
            line-height: 1;
            flex-shrink: 0;
        }

        .btn .machine-name {
            color: #fff;
            font-size: calc(var(--card-size) * 0.17);
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            line-height: 1;
        }

        .btn .status-badge {
            display: inline-block;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: calc(var(--card-size) * 0.015) calc(var(--card-size) * 0.05);
            font-size: calc(var(--card-size) * 0.17);
            font-weight: 900;
            letter-spacing: 1px;
            text-shadow: 0 0 4px currentColor;
            line-height: 1.3;
        }

        .btn.on-state  .status-badge { color: #22ff22; }
        .btn.off-state .status-badge { color: #ff4444; }
        .btn.nosig-state .status-badge { color: #ccc; }

        /* LINE 2: Date + Time + Shift, all together */
        .btn .datetime-line {
            color: rgba(255, 255, 255, 0.9);
            font-size: calc(var(--card-size) * 0.115);
            font-weight: 600;
            line-height: 1.1;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 100%;
            flex-shrink: 0;
        }

        /* Separator */
        .btn .separator {
            width: 60%;
            height: 1px;
            background: rgba(255, 255, 255, 0.4);
            margin: 1px 0;
            flex-shrink: 0;
        }

        /* LINE 3 (bottom): Efficiency in the middle */
        .btn .eff-line {
            color: #fff;
            font-size: calc(var(--card-size) * 0.16);
            font-weight: 900;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
            line-height: 1;
            flex-shrink: 0;
        }

        .btn .eff-label {
            font-size: calc(var(--card-size) * 0.09);
            font-weight: 600;
            opacity: 0.9;
            margin-right: 2px;
        }

        /* LINE 4 & 5 (below efficiency): ON HH:MM on its own line, OFF HH:MM on its own line */
        .btn .hours-badge {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: calc(var(--card-size) * 0.02);
            background: rgba(0, 0, 0, 0.75);
            border-radius: 8px;
            padding: calc(var(--card-size) * 0.03) calc(var(--card-size) * 0.06);
            font-size: calc(var(--card-size) * 0.11);
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
            line-height: 1.3;
            margin-top: 1px;
            flex-shrink: 0;
        }

        .btn .hours-badge .h-on  { color: #22ff22; }
        .btn .hours-badge .h-off { color: #ff6b6b; }

        /* Last update */
        #lastUpdate {
            color: #888;
            font-size: clamp(6px, 1.5vw, 9px);
            text-align: center;
            margin: 1px 0;
            flex-shrink: 0;
        }

        /* EXTRA SMALL SCREENS */
        @media (max-width: 400px) {
            h1 { font-size: 30px; margin: 3px 0 1px; letter-spacing: 1px; }
            .stat-box { font-size: 26px; padding: 6px 8px; }
            .part-nav { margin: 2px 0; gap: 8px; }
            .part-box { padding: 4px 20px; min-width: 130px; }
            .part-name { font-size: 24px; }
            .arrow-btn { font-size: 36px; padding: 0 8px; }
        }

        /* Landscape */
        @media (orientation: landscape) and (max-height: 500px) {
            h1 { font-size: 24px; margin: 2px 0; }
            .stat-box { font-size: 20px; padding: 4px 10px; }
            .part-nav { margin: 1px 0; }
        }
    </style>
</head>
<body>
    <h1>MACHINE MONITOR</h1>

    <div class="part-nav">
        <button class="arrow-btn" id="prevBtn" onclick="changePart(-1)">◀</button>
        <div class="part-box">
            <div class="part-name" id="partName">Part-1</div>
        </div>
        <button class="arrow-btn" id="nextBtn" onclick="changePart(1)">▶</button>
    </div>

    <div class="status-bar">
        <div class="stat-box on-box">ON: <span id="onCount">0</span></div>
        <div class="stat-box off-box">OFF: <span id="offCount">0</span></div>
    </div>

    <div class="main-content">
        <div class="buttons-row" id="buttonRow">Loading...</div>
    </div>


    <p id="lastUpdate"></p>

    <script>
        const URL = 'https://script.google.com/macros/s/AKfycbxL2vRk-GKdOhaoY0OVokRMuUu2Fe_NAF4Y1BpxIBASAFpZDdbrTXgtvEXFnfFPAA1r/exec';

        const COLS = 3;   // machines per row
        const ROWS = 4;   // 12 machines per part = 3 x 4
        const GAP = 10;   // must match CSS .buttons-row gap (px)

        let allData = [];
        let selectedMachine = '';
        let currentPart = 1;

        function fetchData() {
            const callbackName = 'jsonpCb_' + Date.now();

            window[callbackName] = function(data) {
                allData = data;
                renderData(data);
                document.getElementById('lastUpdate').textContent =
                    'Last: ' + new Date().toLocaleTimeString('en-IN');

                delete window[callbackName];
                if (script.parentNode) script.parentNode.removeChild(script);
            };

            const script = document.createElement('script');
            script.src = URL + '?callback=' + callbackName;
            document.body.appendChild(script);
        }

        function hhmm(min) {
            const m = Math.round(Number(min) || 0);
            return String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
        }

        function getCurrentPartData() {
            return allData.filter(m => {
                const n = parseInt(String(m.machine || '').replace(/[^0-9]/g, ''));
                if (currentPart === 1) return n >= 1 && n <= 12;
                return n >= 13 && n <= 24;
            }).sort((a, b) => {
                const na = parseInt(String(a.machine).replace(/[^0-9]/g, ''));
                const nb = parseInt(String(b.machine).replace(/[^0-9]/g, ''));
                return na - nb;
            });
        }

        function renderMachineButton(m) {
            const status = String(m.status || '--').toUpperCase();
            const stateCls = status === 'ON' ? 'on-state' : status === 'OFF' ? 'off-state' : 'nosig-state';
            const eff = Number(m.efficiency) || 0;
            const glowCls = eff >= 80 ? 'glow-high' : eff >= 50 ? 'glow-mid' : 'glow-low';
            const selCls = m.machine === selectedMachine ? ' selected' : '';

            // Line 2: Date + Time + Shift together (date shown without year to save space)
            let dateStr = m.date || '';
            if (!dateStr && m.time) {
                const today = new Date();
                dateStr = String(today.getDate()).padStart(2, '0') + '/' +
                          String(today.getMonth() + 1).padStart(2, '0');
            } else if (dateStr) {
                const parts = dateStr.split('/');
                if (parts.length === 3) dateStr = parts[0] + '/' + parts[1];
            }
            const timeStr = (m.time || '--:--:--').slice(0, 5); // HH:MM
            const shift = m.shift || '-';
            const datetimeLine = dateStr + ' ' + timeStr + ' S-' + shift;

            return '<button class="btn ' + stateCls + ' ' + glowCls + selCls + '" ' +
                   'onclick="filterMachine(\'' + m.machine + '\')">' +
                '<div class="name-status-line">' +
                    '<span class="machine-name">' + (m.machine || '?') + '</span>' +
                    '<span class="status-badge">' + status + '</span>' +
                '</div>' +
                '<div class="datetime-line">' + datetimeLine + '</div>' +
                '<div class="separator"></div>' +
                '<div class="eff-line">' +
                    '<span class="eff-label">Eff:</span>' + eff + '%' +
                '</div>' +
                '<div class="hours-badge">' +
                    '<span class="h-on">ON ' + hhmm(m.onTime) + '</span>' +
                    '<span class="h-off">OFF ' + hhmm(m.offTime) + '</span>' +
                '</div>' +
            '</button>';
        }

        // Sizes every .btn card as a perfect square that always fits the
        // available space (3 columns x 4 rows) with no page scrolling,
        // and drives every font size inside it via --card-size.
        function applySquareSizing() {
            const row = document.getElementById('buttonRow');
            const cards = row.querySelectorAll('.btn');
            if (cards.length === 0) return;

            const availW = row.clientWidth;
            const availH = row.clientHeight;

            const cellW = (availW - GAP * (COLS - 1)) / COLS;
            const cellH = (availH - GAP * (ROWS - 1)) / ROWS;
            const size = Math.floor(Math.max(0, Math.min(cellW, cellH)));

            cards.forEach(btn => {
                btn.style.width = size + 'px';
                btn.style.height = size + 'px';
                btn.style.setProperty('--card-size', size + 'px');
            });
        }

        function renderData(data) {
            const partData = getCurrentPartData();

            let on = 0, off = 0;
            partData.forEach(m => {
                if (m.status === 'ON') on++;
                else off++;
            });

            document.getElementById('onCount').textContent = on;
            document.getElementById('offCount').textContent = off;

            const container = document.getElementById('buttonRow');
            if (partData.length === 0) {
                container.innerHTML = '<div style="text-align:center;color:#888;padding:20px;">No data</div>';
            } else {
                container.innerHTML = partData.map(renderMachineButton).join('');
            }

            document.getElementById('partName').textContent = 'Part-' + currentPart;
            document.getElementById('prevBtn').disabled = (currentPart === 1);
            document.getElementById('nextBtn').disabled = (currentPart === 2);

            requestAnimationFrame(applySquareSizing);
        }

        function changePart(direction) {
            const newPart = currentPart + direction;
            if (newPart < 1 || newPart > 2) return;
            currentPart = newPart;
            renderData(allData);
        }

        function filterMachine(machineName) {
            selectedMachine = selectedMachine === machineName ? '' : machineName;
            renderData(allData);
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft') changePart(-1);
            if (e.key === 'ArrowRight') changePart(1);
        });

        window.addEventListener('resize', applySquareSizing);
        window.addEventListener('orientationchange', applySquareSizing);

        fetchData();
        setInterval(fetchData, 15000);
    </script>
</body>
</html>
